{% extends "base.html" %}{% block title %}Settings · Bayou Bill{% endblock %}
{% block body %}
<h1>Fee model &amp; settings</h1>
<p class="muted">Etsy's order data has no full fee breakdown, so Etsy profit uses
  this estimate. Printify costs are real once synced.</p>
<div class="panel"><form method="post">
  <div class="fields">
    <div><label>Transaction fee %</label><input type="number" step="0.01" name="transaction_fee_pct" value="{{ s.transaction_fee_pct }}"></div>
    <div><label>Processing fee %</label><input type="number" step="0.01" name="processing_fee_pct" value="{{ s.processing_fee_pct }}"></div>
    <div><label>Processing fixed (per order)</label><input type="number" step="0.01" name="processing_fee_fixed" value="{{ s.processing_fee_fixed }}"></div>
    <div><label>Listing fee (per item)</label><input type="number" step="0.01" name="listing_fee" value="{{ s.listing_fee }}"></div>
    <div><label>Offsite ads %</label><input type="number" step="0.01" name="offsite_ads_pct" value="{{ s.offsite_ads_pct }}"></div>
    <div><label>Currency</label><input type="text" name="currency" value="{{ s.currency }}"></div>
  </div>
  <button class="primary" type="submit" style="margin-top:.8rem">Save settings</button>
</form></div>
{% endblock %}
